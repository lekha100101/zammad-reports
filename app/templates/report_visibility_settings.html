{% extends "base.html" %}{% block content %}
<h1>Отображение отчетов</h1>
<p>Можно скрывать отчеты и менять порядок их отображения в меню кнопками ↑ и ↓.</p>
<form method="post" action="/admin/report-visibility" id="reportVisibilityForm">
<input type="hidden" name="report_order" id="reportOrder">
<div class="table-wrapper"><table class="report-table compact-table">
<thead><tr><th>Отчет</th><th class="center">Показывать</th><th class="center">Порядок</th></tr></thead>
<tbody id="reportRows">
{% for key, name in reports %}
<tr data-report-key="{{ key }}">
<td>{{ name }}</td>
<td class="center"><input type="checkbox" name="enabled_reports" value="{{ key }}" {% if key in enabled %}checked{% endif %}></td>
<td class="center"><button type="button" class="btn-small move-up" title="Выше">↑</button> <button type="button" class="btn-small move-down" title="Ниже">↓</button></td>
</tr>
{% endfor %}
</tbody></table></div>
<div style="margin-top:12px"><button type="submit">Сохранить</button></div>
</form>
<script>
(function () {
  const tbody = document.getElementById("reportRows");
  const form = document.getElementById("reportVisibilityForm");
  const order = document.getElementById("reportOrder");
  tbody.addEventListener("click", function (event) {
    const button = event.target.closest(".move-up, .move-down");
    if (!button) return;
    const row = button.closest("tr");
    if (button.classList.contains("move-up") && row.previousElementSibling) {
      tbody.insertBefore(row, row.previousElementSibling);
    } else if (button.classList.contains("move-down") && row.nextElementSibling) {
      tbody.insertBefore(row.nextElementSibling, row);
    }
  });
  form.addEventListener("submit", function () {
    order.value = Array.from(tbody.querySelectorAll("tr[data-report-key]"))
      .map(row => row.dataset.reportKey).join(",");
  });
})();
</script>
{% endblock %}
